<style>
        /* Role Selector Active State Sliding Indicator Logic handled via JS class toggling for simplicity, 
           but CSS variables provide smooth transitions */
        .role-tab {
            position: relative;
            transition: all 0.3s ease;
        }
        .role-tab.active {
            color: theme('colors.primary-container');
        }
        .role-tab::before {
            content: '';
            position: absolute;
            top: -2px; /* Pull up to overlap border container if needed, or align top */
            left: 0;
            width: 100%;
            height: 2px;
            background-color: theme('colors.primary-container');
            opacity: 0;
            transform: scaleX(0);
            transition: all 0.3s ease;
        }
        .role-tab.active::before {
            opacity: 1;
            transform: scaleX(1);
            box-shadow: 0 0 10px theme('colors.primary-container');
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(0, 219, 231, 0.05) 0%, rgba(13, 21, 21, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        
        /* Custom Input Auto-fill style override for dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px theme('colors.surface-container-highest') inset !important;
            -webkit-text-fill-color: theme('colors.on-surface') !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-primary-container selection:text-on-primary">
<!-- Background Texture & Glow -->

<div class="ambient-glow"></div>
<div class="w-full h-full bg-cover bg-center opacity-30 mix-blend-screen" data-alt="A dark, minimal space-themed background texture. Deep navy blue and obsidian black tones with subtle, ethereal cyan nebulous glowing particles scattered sparsely. The lighting is low-key, evoking a sophisticated, high-tech atmospheric depth. High resolution, completely abstract and non-distracting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDK5BkKsNJrImGMMtXwkWityTd_7fAac9u6BhmPhRH-KR1KvVLmpBxnejk9shoBALSZEjpOv_eaXU32h4GFDR-TcpsqlmRAJzW3uSqJMWd0i3fqx5A8vH18pcZvJXD2kPMxkCClL7ceQdQXYw1td6vGB67yFnGo2Lx_7KMi4eACPUwyqGRWtTmm5JQS7hRg0w4XbNSBfmsdOIeYCGEmOWfR6zG93qQLUIivkIRdLm9SdI-nMNrmWM8g')"></div>
<div class="absolute inset-0 bg-background/80 backdrop-blur-sm"></div>
</div>
<!-- Top Left Brand Anchor -->
<div class="absolute top-0 left-0 p-lg z-20 flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">
            school
        </span>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-primary-container tracking-tight">Aether Academy</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Admin Portal</span>
</div>
</div>
<!-- Main Canvas: Centered Login Card -->
<main class="relative z-10 w-full max-w-[440px] px-md md:px-0">
<!-- Glassmorphism Card (Level 1) -->
<div class="bg-surface-container-low/70 backdrop-blur-[20px] border border-white/10 rounded-xl p-lg md:p-xl shadow-2xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-xs">
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Authenticate to access your workspace.</p>
</div>
<!-- Role Selector (Segmented Tab) -->
<div aria-label="Select Role" class="bg-surface-container/50 rounded-lg p-1 flex relative isolate" role="tablist">
<!-- Background slider could be added here, using simple active states for this iteration -->
<button aria-selected="true" class="role-tab active flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-container" onclick="selectRole(this, 'student')" role="tab" type="button">Student</button>
<button aria-selected="false" class="role-tab flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-container" onclick="selectRole(this, 'faculty')" role="tab" type="button">Faculty</button>
<button aria-selected="false" class="role-tab flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-container" onclick="selectRole(this, 'admin')" role="tab" type="button">Admin</button>
<button aria-selected="false" class="role-tab flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-container" onclick="selectRole(this, 'parent')" role="tab" type="button">Parent</button>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Hidden Input for Role -->
<input id="user_role" name="user_role" type="hidden" value="student"/>
<!-- Email Field -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none" style="font-size: 20px;">mail</span>
<input autocomplete="email" class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors placeholder:text-outline-variant/50" id="email" name="email" placeholder="Enter your institutional email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none" style="font-size: 20px;">lock</span>
<input autocomplete="current-password" class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors placeholder:text-outline-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility_icon" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-highest text-primary-container focus:ring-primary-container focus:ring-offset-background transition-colors cursor-pointer" name="remember" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary-fixed-dim transition-colors underline-offset-4 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Primary CTA Action -->
<button class="mt-sm w-full py-3 bg-primary-container text-on-primary font-label-md text-label-md font-bold rounded-lg hover:shadow-[0_0_15px_rgba(0,242,255,0.4)] hover:bg-primary-fixed hover:text-on-primary-fixed transition-all duration-300 flex justify-center items-center gap-2 group" type="submit">
                    Login
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-size: 18px; font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</form>
<!-- Footer Hint -->
<div class="pt-sm border-t border-white/5 text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Demo credentials: admin / password
                </p>
</div>
</div>
</main>
<!-- Interactive Scripts -->
<script>
        function selectRole(element, role) {
            // Update UI
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.remove('active');
                tab.setAttribute('aria-selected', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-selected', 'true');
            
            // Update hidden form input
            document.getElementById('user_role').value = role;
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('visibility_icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
